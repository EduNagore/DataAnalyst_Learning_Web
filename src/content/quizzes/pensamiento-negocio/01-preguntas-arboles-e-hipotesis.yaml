lesson: pensamiento-negocio/01-preguntas-arboles-e-hipotesis
questions:
  - id: neg1-01-q1
    type: single
    difficulty: 1
    prompt: '¿Cuál de estas es una pregunta contestable, con decisión, métrica, comparación y periodo?'
    options:
      - '¿Cómo seguimos creciendo?'
      - '¿Qué parte del aumento de ingresos netos de 2024 a 2025 se debe a más clientes, más frecuencia o mayor ticket, para decidir dónde invertir en 2027?'
      - '¿Qué pasa con las ventas?'
      - '¿Podemos analizar los datos?'
    answer: [1]
    explanation: 'Incluye la decisión (dónde invertir), la métrica (ingresos netos), la comparación (2024 frente a 2025) y el periodo. Las demás son deseos o preguntas sin criterio para responderlas.'
    ref: '#de-la-petición-a-una-pregunta-contestable'

  - id: neg1-01-q2
    type: single
    difficulty: 2
    prompt: '¿Qué significa que un árbol de problemas sea MECE?'
    options:
      - 'Que tiene muchas ramas'
      - 'Que sus ramas no se solapan (mutuamente excluyentes) y entre todas cubren el total (colectivamente exhaustivas)'
      - 'Que las ramas están ordenadas por importancia'
      - 'Que cada rama tiene el mismo tamaño'
    answer: [1]
    explanation: 'MECE: mutually exclusive, collectively exhaustive. Sin solapes (cada cosa en una sola rama) y sin huecos. Un árbol matemático (una fórmula) lo es por construcción.'
    ref: '#árboles-de-problemas-y-mece'

  - id: neg1-01-q3
    type: numeric
    difficulty: 2
    prompt: 'En Lumen, los clientes activos pasaron de 21.606 (2024) a 39.190 (2025). ¿Qué crecimiento porcentual es? (un decimal)'
    answer: [81.4]
    tolerance: 0.06
    explanation: '39.190 / 21.606 = 1,814, es decir, +81,4 %. Es el factor que más pesó en el crecimiento de los ingresos (75,3 % del total en la descomposición logarítmica).'
    ref: '#árboles-de-problemas-y-mece'

  - id: neg1-01-q4
    type: single
    difficulty: 2
    prompt: 'Los ingresos son el producto de clientes activos, pedidos por cliente y ticket medio. ¿Por qué se reparte su variación con logaritmos y no con una suma simple de porcentajes?'
    options:
      - 'Porque los logaritmos son más precisos con los decimales'
      - 'Porque los factores se multiplican, y el logaritmo de un producto es la suma de los logaritmos, lo que permite un reparto aditivo que suma 100 %'
      - 'Porque es la única forma posible'
      - 'Porque así el ticket pesa más'
    answer: [1]
    explanation: 'Con factores multiplicativos, +81 %, +20 % y +1 % no se suman para obtener +120 %. En logaritmos sí son aditivos y las contribuciones suman exactamente el 100 %.'
    ref: '#árboles-de-problemas-y-mece'

  - id: neg1-01-q5
    type: multiple
    difficulty: 2
    prompt: 'Selecciona TODAS las características de una buena hipótesis para el análisis.'
    options:
      - 'Es falsable: se puede saber qué dato la refutaría'
      - 'Indica dónde se vería en los datos'
      - 'Es tan general que nunca puede ser falsa'
      - 'Se prioriza por impacto, probabilidad y coste de comprobarla'
    answer: [0, 1, 3]
    explanation: 'Una hipótesis que no puede refutarse no guía el análisis. Las buenas dicen qué se espera, dónde se vería y qué la refutaría, y se ordenan por impacto, probabilidad y coste.'
    ref: '#análisis-guiado-por-hipótesis'

  - id: neg1-01-q6
    type: single
    difficulty: 3
    prompt: 'La descomposición dice que los clientes activos explican el 75 % del crecimiento pasado. ¿Qué conclusión es válida?'
    options:
      - 'Invertir más en captación producirá siempre el 75 % de un nuevo crecimiento'
      - 'Los clientes activos fueron el factor que más se movió, pero la descomposición no dice por qué ni qué ocurrirá si se empuja ese factor'
      - 'El ticket medio no importa nunca'
      - 'La frecuencia es la causa del crecimiento'
    answer: [1]
    explanation: 'Una descomposición describe qué factor se movió, no su causa ni su respuesta a una intervención. Para eso hacen falta hipótesis causales y, idealmente, un experimento.'
    ref: '#árboles-de-problemas-y-mece'
