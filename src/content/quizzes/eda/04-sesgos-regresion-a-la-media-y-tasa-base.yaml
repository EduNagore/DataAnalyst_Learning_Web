lesson: eda/04-sesgos-regresion-a-la-media-y-tasa-base
questions:
  - id: eda1-04-q1
    type: single
    difficulty: 1
    prompt: 'Calculas el gasto medio por cliente solo entre los clientes captados en 2023-2024 que siguen comprando en 2025 y obtienes 828 €. ¿Qué sesgo hay y qué cifra es más adecuada para decidir cuánto invertir en captar un cliente?'
    options:
      - 'Sesgo de supervivencia; el gasto por cliente captado (613 €), porque incluye a los que no volvieron'
      - 'No hay sesgo; 828 € es correcto'
      - 'Sesgo de confirmación; hay que subir la cifra'
      - 'Regresión a la media; hay que esperar al siguiente semestre'
    answer: [0]
    explanation: 'Los clientes inactivos no aparecen en la media de los activos, así que se sobrestima el valor (828 € frente a 613 €, un 35 % más). Para decidir cuánto pagar por captar, el denominador correcto son todos los captados.'
    ref: '#sesgo-de-supervivencia'

  - id: eda1-04-q2
    type: single
    difficulty: 2
    prompt: 'Lanzas una campaña a los clientes que más gastaron en el primer semestre y su gasto medio baja un 82 % en el segundo. ¿Qué conclusión es la correcta?'
    options:
      - 'La campaña ha fracasado'
      - 'No se puede concluir nada sin un grupo de control: parte de la caída es regresión a la media (la correlación entre semestres es solo 0,15)'
      - 'Los clientes se han desencantado'
      - 'Hay que lanzar otra campaña'
    answer: [1]
    explanation: 'Un grupo seleccionado por ser extremo tiende a acercarse a la media en la siguiente medición aunque no se haga nada. Hay que comparar con un grupo de control seleccionado de la misma forma (por ejemplo, dividiendo al azar el 10 % superior).'
    ref: '#regresión-a-la-media'

  - id: eda1-04-q3
    type: multiple
    difficulty: 2
    prompt: 'Selecciona TODOS los casos que son ejemplos de sesgo de selección.'
    options:
      - 'Una encuesta de satisfacción que solo contestan los muy contentos y los muy enfadados'
      - 'Analizar el comportamiento de los clientes que contactan con soporte y generalizarlo a toda la base'
      - 'Calcular una media con una fórmula equivocada'
      - 'Un experimento donde cada participante elige su grupo'
    answer: [0, 1, 3]
    explanation: 'En los tres casos, algo decide quién entra en los datos y eso se relaciona con lo que se mide. Una fórmula equivocada es un error de cálculo, no de selección.'
    ref: '#sesgo-de-selección'

  - id: eda1-04-q4
    type: numeric
    difficulty: 3
    prompt: 'De 10.000 pedidos, 626 se devolverán. Una alerta detecta el 80 % de las devoluciones y da falsa alarma en el 10 % de los que no se devuelven (9.374). ¿Qué porcentaje de las alertas son devoluciones reales? Redondea a un decimal.'
    answer: [34.8]
    tolerance: 0.1
    explanation: 'Verdaderos: 0,80 × 626 ≈ 501; falsos: 0,10 × 9.374 ≈ 937. Precisión = 501 / (501 + 937) = 34,8 %. La tasa base baja (6,26 %) hace que, aunque el modelo parezca bueno, dos de cada tres alertas sean falsas.'
    ref: '#tasa-base'

  - id: eda1-04-q5
    type: single
    difficulty: 2
    prompt: 'En el cálculo de la precisión de una alerta (valor predictivo positivo), ¿qué dato se olvida más a menudo?'
    options:
      - 'La sensibilidad'
      - 'La tasa base (la frecuencia del suceso en la población)'
      - 'El número de decimales'
      - 'El nombre del modelo'
    answer: [1]
    explanation: 'Sensibilidad y especificidad no bastan: la precisión depende de qué fracción de la población tiene realmente el suceso. Con tasas base bajas, hasta un modelo muy bueno genera muchas falsas alarmas.'
    ref: '#tasa-base'

  - id: eda1-04-q6
    type: single
    difficulty: 2
    prompt: '¿Cuál es la mejor defensa común frente a la regresión a la media y a la selección al evaluar una intervención?'
    options:
      - 'Usar más datos'
      - 'Un grupo de control formado igual que el grupo tratado (idealmente por aleatorización)'
      - 'Calcular la media en lugar de la mediana'
      - 'Repetir el análisis con otra herramienta'
    answer: [1]
    explanation: 'Más datos no corrigen un sesgo de selección y una herramienta distinta no cambia cómo se formó el grupo. El control comparable es lo que aísla el efecto de la intervención.'
    ref: '#regresión-a-la-media'
