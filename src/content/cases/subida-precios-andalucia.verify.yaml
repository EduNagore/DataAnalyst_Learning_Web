  ), a AS (SELECT andal, per, SUM(rev) AS rev, SUM(q) AS q FROM x WHERE per IS NOT NULL GROUP BY 1, 2)
  SELECT ROUND(100 * (MAX(rev) FILTER (WHERE NOT andal AND per = 'post') / MAX(rev) FILTER (WHERE NOT andal AND per = 'pre') - 1), 2) FROM a
