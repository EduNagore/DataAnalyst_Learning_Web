[project]
name = "data-analyst-academy"
version = "0.1.0"
description = "Generación del dataset Lumen, tests de laboratorios y scripts auxiliares de Data Analyst Academy."
requires-python = ">=3.13"
dependencies = [
  # Alineadas con lo que trae Pyodide 314.x (ver PLAN.md §8): cuando se
  # actualice la versión de Pyodide fijada en el worker del navegador, re-
  # verificar y alinear estas versiones para que `pytest` prueba exactamente
  # lo mismo que corre en el cliente.
  "pandas>=3.0,<3.1",
  "numpy>=2.4,<2.5",
  "duckdb>=1.5,<1.6",
  "polars>=1.33,<1.34",
  "pyarrow>=22,<23",
  "scipy>=1.18,<1.19",
  "statsmodels>=0.14.6,<0.15",
  "scikit-learn>=1.8,<1.9",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "formulas>=1.2"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/labs"]

[tool.ruff.lint.per-file-ignores]
"scripts/gen-modules.py" = ["E501"]
"scripts/build-workbooks.py" = ["E501"]
"public/py/**" = ["E501", "B", "SIM"]
"src/content/labs/**/*.py" = ["E501", "F401"]
