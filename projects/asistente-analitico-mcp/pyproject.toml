[project]
name = "asistente-analitico-mcp"
version = "0.1.0"
description = "Servidor MCP de solo lectura sobre DuckDB, con validación, límites y evaluación"
requires-python = ">=3.11"
dependencies = [
  # Comprueba en la documentación del SDK de MCP la versión y la API vigentes (cambian entre versiones).
  "mcp[cli]>=2.0",
  "duckdb>=1.5",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
