name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint · typecheck · unit · contenido · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm/setup reemplaza a pnpm/action-setup + actions/setup-node para
      # pnpm v11+ (este proyecto usa pnpm 12): instala el binario de pnpm y
      # el runtime de Node en un solo paso.
      - uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Formato (Prettier)
        run: pnpm format

      - name: Typecheck (astro check)
        run: pnpm check

      - name: Tests unitarios (Vitest)
        run: pnpm test

      - name: Validar integridad del contenido
        run: pnpm validate-content

      - name: Build
        run: pnpm build

      - name: Instalar navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke e2e (Playwright)
        run: pnpm e2e

      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  python:
    name: Python (ruff · pytest de laboratorios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Instalar uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Comprobar que existe el entorno Python del proyecto
        id: has-pyproject
        run: echo "exists=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias (uv)
        if: steps.has-pyproject.outputs.exists == 'true'
        run: uv sync --all-extras

      - name: Ruff
        if: steps.has-pyproject.outputs.exists == 'true'
        run: uv run ruff check .

      - name: pytest (labs SQL y Python)
        if: steps.has-pyproject.outputs.exists == 'true'
        run: uv run pytest -q
